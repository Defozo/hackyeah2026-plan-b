name: plan-b
services:
  app:
    build: .
    image: plan-b:local
    # One service only. Reuse the built-in bridge without allocating a new subnet.
    network_mode: bridge
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PLANB_HTTP_PORT:-8181}:8791"
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8181}
      APP_MODE: ${APP_MODE:-demo}
      AI_ENABLED: ${AI_ENABLED:-false}
      ALLOW_PERSONAL_DATA_TO_AI: ${ALLOW_PERSONAL_DATA_TO_AI:-false}
      PERSONAL_AI_REVIEW_ID: ${PERSONAL_AI_REVIEW_ID:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      PLANB_SESSION_SECRET: ${PLANB_SESSION_SECRET:-}
      AI_DAILY_BUDGET_USD: ${AI_DAILY_BUDGET_USD:-5}
      LLM_MODEL: openai/gpt-oss-120b
      STT_MODEL: whisper-large-v3-turbo
      BUDGET_DB_PATH: /app/data/budget.sqlite
      NFZ_CACHE_TTL_SECONDS: 900
    volumes:
      - api-budget:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    pids_limit: 128
volumes:
  api-budget:
